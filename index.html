function loadFirst(srcs, done) {              // 依次尝试几个地址，哪个能加载就用哪个
  if (!srcs.length) return done();
  const el = document.createElement('script');
  el.src = srcs[0]; el.onload = done; el.onerror = () => { el.remove(); loadFirst(srcs.slice(1), done); };
  document.head.appendChild(el);
}
loadFirst(['three.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'], () =>
  loadFirst(['OrbitControls.js', 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js',
             'https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js'], main));
function main() {
if (!window.THREE || !THREE.OrbitControls) { document.getElementById('err').style.display = 'flex'; return; }
const S = 0.001;                                   // 毫米 → 米
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9edf1);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 300);
const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.49;
scene.add(new THREE.AmbientLight(0xffffff, 0.93));
const sun = new THREE.DirectionalLight(0xffffff, 0.2); sun.position.set(-6, 12, 8); scene.add(sun);
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function tex(canvas) { const t = new THREE.CanvasTexture(canvas); t.anisotropy = maxAniso; return t; }

// ── 地面：整屋一张图 ──
(function () {
  const ppm = 0.3, c = document.createElement('canvas');
  c.width = Math.round(D.house[0] * ppm); c.height = Math.round(D.house[1] * ppm);
  const t = tex(c);
  function draw() {
    const x = c.getContext('2d'); x.setTransform(ppm, 0, 0, ppm, 0, 0);
    x.fillStyle = '#c9ccd0'; x.fillRect(0, 0, D.house[0], D.house[1]);
    x.fillStyle = '#efe9dc'; D.zones.forEach(r => x.fillRect(r[0], r[1], r[2] - r[0], r[3] - r[1]));
    if (D.start) { x.fillStyle = '#a8dba8'; x.fillRect(D.start[0], D.start[1], D.start[2] - D.start[0], D.start[3] - D.start[1]); }
    x.strokeStyle = '#8f8f8f'; x.lineWidth = 12; x.beginPath();
    D.joints.forEach(j => { x.moveTo(j[0], j[1]); x.lineTo(j[2], j[3]); }); x.stroke();
    D.baths.forEach(b => {
      x.fillStyle = '#f7ead0'; x.fillRect(b.rect[0], b.rect[1], b.rect[2] - b.rect[0], b.rect[3] - b.rect[1]);
      x.fillRect(b.door[0], b.door[1], b.door[2] - b.door[0], b.door[3] - b.door[1]);
      x.strokeStyle = '#a2542c'; x.lineWidth = 14; x.beginPath();
      b.joints.forEach(j => { x.moveTo(j[0], j[1]); x.lineTo(j[2], j[3]); });
      x.moveTo(b.door[0], b.door[1]); x.lineTo(b.door[0], b.door[3]); x.stroke();
    });
    t.needsUpdate = true;
  }
  draw();
  const m = new THREE.Mesh(new THREE.PlaneGeometry(D.house[0] * S, D.house[1] * S), new THREE.MeshLambertMaterial({map: t}));
  m.rotation.x = -Math.PI / 2; m.position.set(D.house[0] * S / 2, 0, D.house[1] * S / 2); scene.add(m);
})();

// ── 其它墙：照图上的墙线立起来 ──
const lowGroup = new THREE.Group(); scene.add(lowGroup);
function buildLow(h) {
  while (lowGroup.children.length) lowGroup.remove(lowGroup.children[0]);
  const mat = new THREE.MeshLambertMaterial({color: 0xb9bec4, side: THREE.DoubleSide, transparent: h > 1, opacity: h > 1 ? 0.35 : 1, depthWrite: h <= 1});
  D.lowWalls.forEach(w => {
    const dx = w[2] - w[0], dy = w[3] - w[1], len = Math.hypot(dx, dy); if (len < 1) return;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(len * S, h), mat);
    m.position.set((w[0] + w[2]) / 2 * S, h / 2, (w[1] + w[3]) / 2 * S); m.rotation.y = -Math.atan2(dy, dx); lowGroup.add(m);
  });
}
buildLow(0.35);

// ── 贴砖的墙面：只画朝屋里的那一面，从外面看过去是透的 ──
D.planes.forEach(p => {
  const dx = p.p1[0] - p.p0[0], dy = p.p1[1] - p.p0[1], len = Math.hypot(dx, dy), hh = p.h1 - p.h0;
  const ppm = 0.5, c = document.createElement('canvas');
  c.width = Math.max(4, Math.round(len * ppm)); c.height = Math.round(hh * ppm);
  const t = tex(c);
  const X = s => p.flip ? (p.s1 - s) : (s - p.s0), Y = h => p.h1 - h;
  function draw() {
    const x = c.getContext('2d'); x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, c.width, c.height); x.setTransform(ppm, 0, 0, ppm, 0, 0);
    x.fillStyle = p.face ? '#efe2c8' : '#f6f3ec'; x.fillRect(0, 0, len, hh);
    x.strokeStyle = '#8a8a8a'; x.lineWidth = 9; x.beginPath();
    p.breaks.forEach(s => { if (s > p.s0 + 1 && s < p.s1 - 1) { x.moveTo(X(s), 0); x.lineTo(X(s), hh); } });
    p.rows.forEach(h => { if (h > p.h0 + 1 && h < p.h1 - 1) { x.moveTo(0, Y(h)); x.lineTo(len, Y(h)); } });
    x.stroke();
    x.strokeStyle = '#6b6b6b'; x.lineWidth = 10; x.strokeRect(0, 0, len, hh);
    p.openings.forEach(o => {
      const a = Math.max(o[0], p.s0), b = Math.min(o[1], p.s1); if (b <= a) return;
      const l = Math.min(X(a), X(b)), w = Math.abs(X(b) - X(a)), tp = Y(Math.min(o[3], p.h1)), hgt = Math.min(o[3], p.h1) - Math.max(o[2], p.h0);
      x.clearRect(l, tp, w, hgt);
      if (o[4] === 'win') { x.fillStyle = 'rgba(120,185,235,0.42)'; x.fillRect(l, tp, w, hgt); }
      if (o[4] === 'niche') { x.fillStyle = '#8c979d'; x.fillRect(l, tp, w, hgt); }
      x.strokeStyle = '#333'; x.lineWidth = 12; x.strokeRect(l, tp, w, hgt);
    });
    t.needsUpdate = true;
  }
  draw();
  const m = new THREE.Mesh(new THREE.PlaneGeometry(len * S, hh * S),
                           new THREE.MeshLambertMaterial({map: t, transparent: true, alphaTest: 0.05, side: THREE.FrontSide,
                                                          polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4}));
  m.position.set((p.p0[0] + p.p1[0]) / 2 * S, (p.h0 + p.h1) / 2 * S, (p.p0[1] + p.p1[1]) / 2 * S);
  m.rotation.y = -Math.atan2(dy, dx); scene.add(m);
});

// ── 包管：实心方块，顶上封住 ──
D.shafts.forEach(r => {
  const w = (r[2] - r[0] - 12) * S, d = (r[3] - r[1] - 12) * S, h = 2.4;
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({color: 0xcfc6b4}));
  m.position.set((r[0] + r[2]) / 2 * S, h / 2, (r[1] + r[3]) / 2 * S); scene.add(m);
});

// ── 房间名 ──
const nameGroup = new THREE.Group(); scene.add(nameGroup);
D.labels.forEach(l => {
  const c = document.createElement('canvas'); c.width = 512; c.height = 160; const x = c.getContext('2d');
  x.font = 'bold 110px "PingFang SC","Heiti SC",sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.lineWidth = 14; x.strokeStyle = '#fff'; x.strokeText(l.t, 256, 84); x.fillStyle = '#7a5a1e'; x.fillText(l.t, 256, 84);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map: tex(c), depthTest: false, transparent: true}));
  sp.scale.set(1.6 * l.size, 0.5 * l.size, 1); sp.position.set(l.x * S, 0.35, l.y * S); sp.renderOrder = 10; nameGroup.add(sp);
});

function go(v) {
  const q = D.views[v]; if (!q) return;
  controls.target.set(q.target[0] * S, q.target[1] * S, q.target[2] * S);
  camera.position.set((q.target[0] + q.offset[0]) * S, (q.target[1] + q.offset[1]) * S, (q.target[2] + q.offset[2]) * S);
  controls.update();
  document.querySelectorAll('#bar button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
}
document.querySelectorAll('#bar button').forEach(b => b.onclick = () => go(b.dataset.v));
document.getElementById('full').onchange = e => buildLow(e.target.checked ? 2.4 : 0.35);
const namesBox = document.getElementById('names');
go((location.hash.match(/v=(\w+)/) || [0, 'house'])[1]);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
(function loop() {
  requestAnimationFrame(loop); controls.update();
  nameGroup.visible = namesBox.checked && camera.position.distanceTo(controls.target) > 7.5;
  renderer.render(scene, camera);
})();
}
